[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-agent"
version = "0.1.0"
description = "A small, testable LLM agent for bulk RNA-seq analysis, run on a local open-weight model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Liu Wei Su" }]
dependencies = ["numpy", "pandas", "pydeseq2>=0.5", "requests"]

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest", "ruff"]

[project.scripts]
rnaseq-agent = "rnaseq_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
